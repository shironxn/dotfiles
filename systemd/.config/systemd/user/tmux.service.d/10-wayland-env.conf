# Managed by dotfiles: tunggu WAYLAND_DISPLAY masuk ke systemd user manager
# (sway import-environment) sebelum tmux server di-spawn, biar pane hasil
# restore dapet env wayland. Timeout 60s supaya tetap jalan tanpa sesi GUI.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 300 ]; do systemctl --user show-environment 2>/dev/null | grep -q "^WAYLAND_DISPLAY=" && exit 0; sleep 0.2; i=$((i+1)); done; exit 0'
