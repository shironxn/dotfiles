# Managed by dotfiles: wait for WAYLAND_DISPLAY in the systemd user manager
# (sway import-environment) before spawning tmux, so panes inherit the wayland
# env. Timeout 60s so the unit still starts without a GUI session.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 300 ]; do systemctl --user show-environment 2>/dev/null | grep -q "^WAYLAND_DISPLAY=" && exit 0; sleep 0.2; i=$((i+1)); done; exit 0'
