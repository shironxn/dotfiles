# tmux-resurrect save.sh gak cek apakah server masih hidup: kalau ExecStop
# jalan setelah server mati (mis. `tmux kill-server` manual, bukan
# `systemctl stop`), dia nulis snapshot KOSONG dan menggeser symlink `last`
# ke situ -- state sebelumnya hilang. Guard: skip save kalau tmux gak bisa
# di-query, biar snapshot terakhir dari continuum tetap utuh.
[Service]
ExecStop=
ExecStop=/bin/sh -c 'if tmux list-windows -a >/dev/null 2>&1; then exec %h/.tmux/plugins/tmux-resurrect/scripts/save.sh; fi'
ExecStop=/usr/bin/tmux kill-server
