format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$nodejs\
$python\
$rust\
$golang\
\n$character"""

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold #e7e3df"

[git_branch]
format = ' [$symbol$branch]($style)'
style = "#77A3AD"
symbol = " "

[git_status]
format = '[$all_status$ahead_behind]($style)'
style = "#EFB8A2"
conflicted = " "
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
staged = " ●"
modified = " !"
stashed = " "
deleted = " ✕"
renamed = " ➜"

[nodejs]
format = ' via [ v$version](bold #97C9CD)'

[python]
format = ' via [ v$version](bold #97C9CD)'

[rust]
format = ' via [ v$version](bold #97C9CD)'

[golang]
format = ' via [ v$version](bold #97C9CD)'

[cmd_duration]
format = 'took [$duration](italic #a19e9c)'
min_time = 2000
show_milliseconds = false

[character]
success_symbol = "[❯](bold #CEBFB5)"
error_symbol = "[❯](bold #EFB8A2)"
vicmd_symbol = "[❮](bold #77A3AD)"

[fill]
symbol = " "
