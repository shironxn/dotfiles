# mpv configuration — Wayland native with Intel hardware acceleration
vo=gpu
gpu-context=wayland
hwdec=auto-safe

# Keep window open after video finishes
keep-open=yes

# Autohide cursor after 1s
cursor-autohide=1000

# High-quality audio resampler
audio-channels=stereo

# Subtitles styling
sub-font="JetBrainsMono Nerd Font"
sub-font-size=36
sub-border-size=2
sub-shadow-offset=1
