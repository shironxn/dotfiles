# Wayland output with hardware decoding
vo=gpu
gpu-context=wayland
hwdec=auto-safe

# Keep the window open after the file ends
keep-open=yes

# Hide the cursor while playing
cursor-autohide=1000

# Downmix everything to stereo
audio-channels=stereo

# Subtitles
sub-font="JetBrainsMono Nerd Font"
sub-font-size=36
sub-border-size=2
sub-shadow-offset=1
