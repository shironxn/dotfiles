# Autostart and daemons

# Polkit authentication agent
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Clipboard history
exec pkill -x wl-paste 2>/dev/null
exec setsid -f wl-paste --type text --watch cliphist store >/dev/null 2>&1
exec setsid -f wl-paste --type image --watch cliphist store >/dev/null 2>&1

# Theme: restore the last pywal session
exec ~/.config/sway/scripts/wal-theme.sh -R

# Telegram call / media viewer as a sticky picture-in-picture panel.
# sway does not re-run exec lines on 'swaymsg reload', so restart it by hand:
#   ~/.config/sway/scripts/telegram-pip.sh stop; setsid -f ~/.config/sway/scripts/telegram-pip.sh
exec setsid -f ~/.config/sway/scripts/telegram-pip.sh >/dev/null 2>&1

# Volume, brightness and microphone OSD
exec pkill -x swayosd-server 2>/dev/null
exec swayosd-server --style ~/.config/swayosd/style.css

# mako is started by its systemd user unit.
