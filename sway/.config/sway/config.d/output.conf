# 176 PPI: scale 1 bikin UI ~46% lebih kecil dari desktop normal. Semua app
# di sini native Wayland (xdg_shell), jadi fractional scale tetap tajam — nggak
# ada XWayland yang perlu di-upscale. Efek 1.25: ukuran fisik font naik 25%,
# grid foot tetap (dpi-aware=no bikin foot ngukur dari scale factor, bukan DPI).
output eDP-1 scale 1.25
# Cuma relevan kalau ada client X11 yang di-upscale dari 1x — sekarang nggak ada.
output eDP-1 scale_filter nearest
output eDP-1 position 1920 0
output HDMI-A-2 position 0 0

# Wallpaper (dikelola native oleh Sway via symlink wallpaper aktif)
output * bg ~/.cache/wal/bg fill
