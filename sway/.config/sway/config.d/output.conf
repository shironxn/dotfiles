# Displays: native 1.0 scale with RGB subpixel rendering, no fractional scaling.
output eDP-1 scale 1.0
output eDP-1 subpixel rgb
output eDP-1 position 1920 0

output HDMI-A-2 scale 1.0
output HDMI-A-2 subpixel rgb
output HDMI-A-2 position 0 0

# Wallpaper comes from the symlink that wal-theme.sh keeps current.
output * bg ~/.cache/wal/bg fill
