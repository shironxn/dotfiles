# Output configuration — Native 1:1 Pixel-Perfect (Zero Fractional Blur)
# ThinkPad X280 13.3" 1080p: Native scale 1.0 ensures razor-sharp 1:1 hardware pixel mapping
output eDP-1 scale 1.0
output eDP-1 subpixel rgb
output eDP-1 position 1920 0

# External 24" 1080p monitor
output HDMI-A-2 scale 1.0
output HDMI-A-2 subpixel rgb
output HDMI-A-2 position 0 0

# Wallpaper (dikelola native oleh Sway via symlink wallpaper aktif)
output * bg ~/.cache/wal/bg fill
