# Focus border colors — from pywal via colors-sway
# Format: <border> <background> <text> <indicator> <child_border>
# child_border $color6 (terang) biar outline window aktif jelas
client.focused          $color4 $color4 $foreground $color4 $color6
client.focused_inactive $color8 $color8 $foreground $color8 $color8
client.unfocused        $color0 $color0 $foreground $color0 $color0
client.urgent           $color1 $color1 $foreground $color1 $color1
