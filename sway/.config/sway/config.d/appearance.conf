# ── Appearance & Window Rules ──
# Panel cuma 1080px tinggi; jangan kasip ruang buat dekorasi.
gaps inner 4
gaps outer 2
smart_gaps off
smart_borders on
default_border pixel 2

# ── Window Rules (Floating Popups & Dialogs) ──
for_window [app_id="wallpaper-picker"] floating enable, move position center
for_window [title="^Wallpaper$"] floating enable, move position center
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [app_id="pavucontrol"] floating enable, move position center
for_window [app_id="imv"] floating enable
for_window [app_id="mpv"] floating enable
