gaps inner 4
gaps outer 2
smart_gaps off
smart_borders on
default_border pixel 2

for_window [app_id="thunar"] opacity 0.95

# Floating rules. window_role is an X11 property, so native Wayland dialogs only
# match window_type.
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_type="dialog"] floating enable
for_window [app_id="pavucontrol"] floating enable, move position center
for_window [app_id="org.gnome.Loupe"] floating enable, move position center
for_window [app_id="org.gnome.FileRoller"] floating enable, move position center
for_window [app_id="file-roller"] floating enable, move position center
for_window [app_id="imv"] floating enable
for_window [app_id="mpv"] floating enable
