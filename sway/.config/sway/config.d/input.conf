# Input devices and cursor

input type:touchpad {
    natural_scroll enabled
    tap enabled
    tap_button_map lmr
    scroll_factor 0.3
}

input "2362:9520:PixArt_Gaming_Mouse" {
    accel_profile flat
    pointer_accel 0
}

# The NACODEX 2.4G dongle repeats KEY_BRIGHTNESSUP on its keyboard interface,
# which drives the brightness to 100% and blocks adjustment. Disable the base
# and keyboard interfaces; the mouse interface keeps working.
input "43173:8551:YJX-CHIP_NACODEX_2.4G" {
    events disabled
}
input "43173:8551:YJX-CHIP_NACODEX_2.4G_Keyboard" {
    events disabled
}

mouse_warping container

seat * xcursor_theme Doro 32
