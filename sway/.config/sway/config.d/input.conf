# --- Input Devices ---
input type:touchpad {
    natural_scroll enabled
    tap enabled
    tap_button_map lmr
    scroll_factor 0.3
}

# Gaming mouse: matiin pointer acceleration biar 1:1
input "2362:9520:PixArt_Gaming_Mouse" {
    accel_profile flat
    pointer_accel 0
}

# NACODEX 2.4G dongle: interface HID-nya spam KEY_BRIGHTNESSUP (225) repeat
# terus-menerus -> brightness ke-drive ke 100% dan nggak bisa di-adjust.
# Dongle ini nongol sebagai 3 identifier; yang spam itu varian _Keyboard.
# Disable base + _Keyboard, Mouse tetap jalan.
input "43173:8551:YJX-CHIP_NACODEX_2.4G" {
    events disabled
}
input "43173:8551:YJX-CHIP_NACODEX_2.4G_Keyboard" {
    events disabled
}

# Mouse warp ke container pas pindah focus pake keyboard
mouse_warping container

# Cursor theme
seat * xcursor_theme Doro 32
