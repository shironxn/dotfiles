pulse.rules = [
    {
        matches = [
            { application.process.binary = "brave" }
            { application.process.binary = "chrome" }
            { application.process.binary = "chromium" }
            { application.process.binary = "firefox" }
            { application.process.binary = "Discord" }
            { application.process.binary = "discord" }
            { application.process.binary = "vesktop" }
            { application.process.binary = "webcord" }
            { application.process.binary = "Telegram" }
            { application.process.binary = "telegram-desktop" }
            { application.process.binary = "teams" }
            { application.process.binary = "teams-for-linux" }
            { application.process.binary = "skypeforlinux" }
            { application.process.binary = "zoom" }
            { application.process.binary = "slack" }
            { application.process.binary = "steam" }
        ]
        actions = {
            quirks = [ block-source-volume ]
        }
    }
]
