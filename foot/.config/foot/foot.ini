# -*- conf -*-

include=~/.cache/wal/colors-foot.ini
font=JetBrainsMono Nerd Font Mono:size=14
font-bold=JetBrainsMono Nerd Font Mono:style=Bold:size=14
font-italic=JetBrainsMono Nerd Font Mono:style=Italic:size=14
pad=12x12
# Size the font from the scale factor instead of the monitor DPI, so the grid
# stays identical when a window moves between the 176 PPI laptop and the 93 PPI monitor.
dpi-aware=no

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=5000
multiplier=3.0

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[colors-dark]
alpha=0.95

[csd]
preferred=server
size=0

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=none
