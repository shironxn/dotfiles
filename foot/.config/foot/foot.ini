# -*- conf -*-

include=~/.cache/wal/colors-foot.ini
font=JetBrainsMono Nerd Font Mono:size=13
font-bold=JetBrainsMono Nerd Font Mono:style=Bold:size=13
font-italic=JetBrainsMono Nerd Font Mono:style=Italic:size=13
pad=12x12
# Keep the grid identical across displays instead of matching physical size.
# The X280 panel is 176 PPI, a 24" 1080p monitor is 93 PPI: with dpi-aware=yes
# foot sized the font to the monitor DPI, so the same window was 1.9x larger on
# the laptop (28 rows) than on the monitor (55 rows). dpi-aware=no sizes the
# font from the scaling factor, so both screens show the same ~186x42 grid and
# nothing jumps when a window moves between them.
dpi-aware=no

[cursor]
style=beam
blink=no

[mouse]
hide-when-typing=yes

[scrollback]
lines=5000
multiplier=3.0

[url]
launch=xdg-open ${url}
osc8-underline=url-mode

[colors-dark]
alpha=0.95

[csd]
preferred=server
size=0

[key-bindings]
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+r Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=none
