# --- General ---
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off

# Window & pane index (mulai dari 1)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Colors & Terminal ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -s set-clipboard on

# --- Splits & Window (tetap di direktori aktif) ---
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Shortcut split alternatif (opsional)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Pane Navigation & Resize ala Vim ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane (Prefix + Shift + H/J/K/L, tanda -r artinya bisa ditekan berulang kali)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick reload config (Prefix + r)
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# --- Vi Mode & Clipboard (Wayland) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

# --- Status Bar & Borders ---
set -g status-position bottom
set -g status-style "bg=#18181b,fg=#a1a1aa"
set -g status-left-length 30
set -g status-left "#[fg=#ffffff,bold] #S #[fg=#3f3f46]│ "
setw -g window-status-format "#[fg=#71717a]#I:#W#{?window_zoomed_flag,#[fg=#f59e0b][Z],} "
setw -g window-status-current-format "#[fg=#ffffff,bold]#I:#W#{?window_zoomed_flag,#[fg=#f59e0b][Z],} "
set -g status-right "#[fg=#3f3f46]│ #[fg=#a1a1aa]%H:%M "
set -g pane-border-style "fg=#27272a"
set -g pane-active-border-style "fg=#52525b"
