# General
set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -g display-time 2000
set -g display-panes-time 2000

# Windows & panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Terminal colors & clipboard
set -g default-terminal "tmux-256color"
# -a = append, gak idempotent: tiap reload nambah 2 entry. Unset dulu biar
# balik ke default tmux, baru append -- hasilnya stabil di 5 entry.
set -su terminal-features
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"
set -s set-clipboard on

# Splits
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Vim navigation
# catatan: tmux makan satu backslash di dalam string berkutip ganda, jadi
# regex perlu '\\S'. Escape lama '\\/' bikin grep warning "stray \ before /".
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

bind C-l send-keys 'C-l'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

# Status bar
set -g status-position bottom
set -g status-style "bg=#18181b,fg=#a1a1aa"
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#18181b]#[bg=#f59e0b]#[bold] 󰌌 WAIT ,#{?#{==:#{pane_mode},tree-mode},#[fg=#18181b]#[bg=#9ece6a]#[bold] 󰙅 TREE ,#{?pane_in_mode,#[fg=#18181b]#[bg=#ef4444]#[bold] 󰆏 COPY ,#[fg=#18181b]#[bg=#8198e3]#[bold] 󰘳 #S }}}#[default] #[fg=#3f3f46]│ "
setw -g window-status-format "#[fg=#71717a]#I:#W#{?window_zoomed_flag,#[fg=#f59e0b][Z],} "
setw -g window-status-current-format "#[fg=#ffffff,bold]#I:#W#{?window_zoomed_flag,#[fg=#f59e0b][Z],} "
set -g status-right "#[fg=#3f3f46]│ #[fg=#a1a1aa]%H:%M "
set -g pane-border-style "fg=#3f3f46"
set -g pane-active-border-style "fg=#8198e3,bold"

# Plugins (TPM)
# XDG config ada, jadi TPM default-nya ~/.config/tmux/plugins -- kita paksa ~/.tmux/plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Asisten CLI (pi dkk): simpan session id PER PANE, restore pakai `--session <id>`.
# `pi --continue` cuma nebak "file .jsonl paling baru di folder cwd ini" -- kalau
# dua pane punya cwd sama (mis. dua-duanya di ~), dua-duanya buka sesi yang SAMA.
# Plugin ini nyatet session id per pane (process-time scoring + dedup) jadi tiap
# pane balik ke sesinya sendiri.
set -g @plugin 'timvw/tmux-assistant-resurrect'

# Jangan pasang hook native Claude/Cursor/OpenCode -- di mesin ini gak ada
# binary-nya, jadi biar plugin gak nyentuh config mereka sama sekali.
set -g @assistant-resurrect-claude 'off'
set -g @assistant-resurrect-cursor 'off'
set -g @assistant-resurrect-opencode 'off'

# resurrect: bawa balik isi scrollback tiap pane, bukan cuma layout
set -g @resurrect-capture-pane-contents 'on'

# CATATAN: pi SENGAJA TIDAK ada di @resurrect-processes.
# Kalau dimasukin, resurrect bakal jalanin `pi` polos (tanpa session id), terus
# restore hook di atas bakal ngetik perintah resume ke dalam TUI yang udah jalan.
# Biarkan pane balik jadi shell dulu, hook yang nge-launch pi dengan --session.

# continuum: auto-save tiap 15 menit, auto-restore pas tmux server start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# continuum: bikin systemd user unit tmux.service -- autostart pas login +
# save otomatis pas shutdown (ExecStop). Tanpa ini, restore cuma jalan
# kalau tmux di-start manual, dan window/pane <15 menit terakhir bisa ilang.
set -g @continuum-boot 'on'

# TPM entry point -- wajib baris terakhir
run '~/.tmux/plugins/tpm/tpm'
