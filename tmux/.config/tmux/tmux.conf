set -s escape-time 0
set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g detach-on-destroy off
set -s extended-keys on
set -s extended-keys-format csi-u
set -g display-time 2000
set -g display-panes-time 2000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -s default-terminal "tmux-256color"
# -a is non-idempotent: reset first so reloads don't stack entries
set -su terminal-features
set -as terminal-features ",*:RGB:usstyle"
set -s set-clipboard on
set -g allow-passthrough on

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-family/fzf get the key; everything else switches panes (format check, no fork)
is_tui='#{m/r:^(g?(view|l?n?vim?x?|fzf))$,#{pane_current_command}}'

bind -n 'C-h' if-shell -F "$is_tui" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell -F "$is_tui" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell -F "$is_tui" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell -F "$is_tui" 'send-keys C-l'  'select-pane -R'

bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# pi: C-l = model selector
bind C-l send-keys 'C-l'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

set -g status-style "bg=#18181b,fg=#a1a1aa"
set -g status-left-length 40
set -g status-left "#{?client_prefix,#[fg=#18181b]#[bg=#f59e0b]#[bold] 󰌌 WAIT ,#{?#{==:#{pane_mode},tree-mode},#[fg=#18181b]#[bg=#9ece6a]#[bold] 󰙅 TREE ,#{?pane_in_mode,#[fg=#18181b]#[bg=#ef4444]#[bold] 󰆏 COPY ,#[fg=#18181b]#[bg=#8198e3]#[bold] 󰘳 #S }}}#[default] #[fg=#3f3f46]│ "
setw -g window-status-format "#[fg=#71717a]#I:#W#{?window_zoomed_flag,#[fg=#f59e0b][Z],} "
setw -g window-status-current-format "#[fg=#ffffff,bold]#I:#W#{?window_zoomed_flag,#[fg=#f59e0b][Z],} "
set -g status-right "#[fg=#3f3f46]│ #[fg=#a1a1aa]%H:%M "
set -g pane-border-style "fg=#3f3f46"
set -g pane-active-border-style "fg=#8198e3,bold"
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "
