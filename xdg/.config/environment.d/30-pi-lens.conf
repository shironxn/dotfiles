# pi-lens: keep its machine-global root (toolchain binaries, logs, caches)
# out of $HOME as a bare dotdir. Relocated 2026-09-24.
PI_LENS_HOME=/home/shironxn/.local/share/pi-lens

# Log hygiene (2026-09-29): default 7 hari/10MB per-file -> lebih hemat.
PI_LENS_LOG_RETENTION_DAYS=3
PI_LENS_MAX_LOG_SIZE_MB=3

# Install control (2026-10-03)
PI_LENS_DISABLE_LSP_INSTALL=1
PI_LENS_DISABLE_TOOL_INSTALL=1
