include=~/.cache/wal/colors-fuzzel.ini

[main]
font=JetBrainsMono Nerd Font:size=14
prompt="❯ "
icon-theme=Papirus-Dark
icons-enabled=yes
fields=filename,name,generic
password-character=*

width=36
lines=10
